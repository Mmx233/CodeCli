name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build packages on POSIX
        if: runner.os != 'Windows'
        run: sh scripts/build.sh ci
      - name: Build packages on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1 ci
